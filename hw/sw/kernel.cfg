# kernel.cfg - ld65 memory layout for the kernel ($E100-$FFFF)
MEMORY {
    KROM:  start = $E100, size = $1E00, fill = yes, fillval = $FF, file = %O;
    JUMPS: start = $FF00, size = $00FA, fill = yes, fillval = $FF, file = %O;
    VECS:  start = $FFFA, size = $0006, fill = yes, fillval = $FF, file = %O;
}
SEGMENTS {
    CODE:    load = KROM,  type = ro;
    RODATA:  load = KROM,  type = ro;
    JUMPS:   load = JUMPS, type = ro;
    VECTORS: load = VECS,  type = ro;
}

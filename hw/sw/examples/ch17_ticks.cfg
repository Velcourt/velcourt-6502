# ch17_ticks.cfg - ld65 layout for ch17_ticks.s: one 64 KB image with the
# program at $0600 and our own vectors at $FFFA, for sim/examples/ch17_irq_tb.v
MEMORY {
    LOW:  start = $0000, size = $FFFA, fill = yes, file = %O;
    VECS: start = $FFFA, size = $0006, fill = yes, file = %O;
}
SEGMENTS {
    ZEROPAGE: load = LOW, type = zp, start = $0080;
    CODE:     load = LOW, type = ro, start = $0600;
    VECTORS:  load = VECS, type = ro;
}
